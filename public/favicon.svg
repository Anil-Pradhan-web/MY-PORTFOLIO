<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#00D4AA" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle (fills 100% canvas) -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#00D4AA" stroke-width="4" stroke-opacity="0.4" />

  <!-- Bold terminal prompt '>' -->
  <path d="M 16 33 L 36 50 L 16 67" fill="none" stroke="url(#tealGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bold 'AP' Monogram (large, high-contrast, fills canvas) -->
  <text x="44" y="69" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1.5">AP</text>
  
  <!-- Subtle glowing dot accent -->
  <circle cx="89" cy="68" r="4.5" fill="#00D4AA" />
</svg>
